<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Print Queue | Decemeberbooth</title>
  <meta name="description" content="Staff print queue for Decemeberbooth events with shared final image links.">
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f4f7f6; color: #163d38; }
    body { margin: 0; }
    header, main { max-width: 1100px; margin: auto; padding: 32px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(1.4rem, 4vw, 2rem); }
    .controls, .queue-item-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    input, button { font: inherit; border-radius: 9px; min-height: 42px; box-sizing: border-box; }
    input { border: 1px solid #b7cbc7; padding: 8px 16px; background: white; }
    select { font: inherit; border-radius: 9px; min-height: 42px; box-sizing: border-box; border: 1px solid #b7cbc7; padding: 8px 16px; background: white; }
    button { border: 0; padding: 16px 24px; background: #176a61; color: white; cursor: pointer; }
    button.secondary { background: #e2ece9; color: #17443e; }
    button.danger { background: #a63f3f; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    #queueStatus { color: #52716c; margin: 0 0 16px; }
    #queueList { display: grid; gap: 16px; }
    .queue-item { display: grid; grid-template-columns: 130px 1fr; gap: 16px; background: white; border: 1px solid #d8e5e2; padding: 16px; border-radius: 14px; box-shadow: 0 3px 12px rgba(20, 67, 61, .06); }
    .queue-item img { width: 130px; height: 170px; object-fit: contain; background: #f2f2f2; border-radius: 8px; }
    .queue-item h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .metadata { margin: 0 0 16px; color: #5b716d; font-size: .9rem; }
    .badge { display: inline-block; padding: 8px 8px; margin-right: 8px; border-radius: 999px; background: #edf4f2; font-size: .78rem; font-weight: 700; text-transform: capitalize; }
    .badge.paid, .badge.comped, .badge.printed { background: #d9f0e2; color: #175d35; }
    .badge.reprint, .badge.unpaid { background: #fff0cf; color: #75520b; }
    .badge.void { background: #f8d6d6; color: #7c2222; }
    .empty { padding: 32px; text-align: center; background: white; border-radius: 14px; color: #5b716d; }
    .session-defaults { flex: 1 0 100%; width: 100%; min-width: 0; padding: 20px; margin-top: 8px; background: white; border: 1px solid #d8e5e2; border-radius: 14px; box-shadow: 0 3px 12px rgba(20, 67, 61, .06); box-sizing: border-box; }
    .session-defaults h2 { margin: 0 0 4px; font-size: 1.1rem; }
    .session-defaults-note { margin: 0; color: #5b716d; }
    .session-defaults-content { display: grid; grid-template-columns: minmax(280px, .8fr) minmax(420px, 1.2fr); gap: 24px; min-width: 0; margin-top: 20px; align-items: center; }
    .session-controls { display: grid; gap: 16px; }
    .print-preview { display: grid; grid-template-columns: 190px minmax(0, 1fr); align-items: center; gap: 24px; }
    .print-preview-visual { min-height: 170px; display: grid; place-items: center; padding: 12px; border-radius: 10px; background: #edf4f2; }
    .print-preview-sheet { display: grid; overflow: hidden; background: white; border: 2px solid #aac1bc; box-shadow: 0 5px 14px rgba(20, 67, 61, .14); transition: width .18s ease, height .18s ease; }
    .print-preview-sheet.landscape { width: 150px; height: 100px; }
    .print-preview-sheet.portrait { width: 100px; height: 150px; }
    .print-preview-sheet.double.landscape { grid-template-columns: 1fr 1fr; }
    .print-preview-sheet.double.portrait { grid-template-rows: 1fr 1fr; }
    .print-preview-slot { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px dashed #c7d8d4; }
    .print-preview-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    .print-preview-copy { min-width: 0; }
    .print-preview-label { margin: 0 0 6px; color: #52716c; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    #printPreviewSummary { display: block; margin-bottom: 6px; font-size: 1.05rem; color: #163d38; }
    #printPreviewDetails { margin: 0; color: #5b716d; line-height: 1.45; }
    .queue-item > div { min-width: 0; }
    .queue-print-settings { margin-top: 16px; padding-top: 14px; border-top: 1px solid #d8e5e2; }
    .queue-print-settings-summary { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .queue-print-settings-copy { flex: 1 1 220px; min-width: 0; }
    .queue-print-settings-label { display: block; margin-bottom: 2px; color: #52716c; font-size: .72rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
    .queue-print-settings-copy strong { display: block; line-height: 1.35; }
    .queue-layout-icon { flex: 0 0 auto; display: grid; width: 48px; height: 32px; padding: 3px; gap: 2px; background: white; border: 2px solid #7fa49e; border-radius: 4px; box-sizing: border-box; }
    .queue-layout-icon.portrait { width: 32px; height: 48px; }
    .queue-layout-icon.double.landscape { grid-template-columns: 1fr 1fr; }
    .queue-layout-icon.double.portrait { grid-template-rows: 1fr 1fr; }
    .queue-layout-icon span { min-width: 0; min-height: 0; background: #cfe6e1; border: 1px solid #9fc6be; border-radius: 2px; }
    .item-print-controls { display: grid; grid-template-columns: repeat(2, minmax(170px, 1fr)) auto; gap: 12px; align-items: end; padding: 14px; margin-top: 12px; background: #f4f8f7; border-radius: 10px; }
    .item-print-controls[hidden] { display: none; }
    .item-print-controls button { min-height: 42px; padding: 10px 16px; }
    @media (max-width: 900px) { header, main { padding: 24px; } }
    @media (max-width: 820px) { .session-defaults-content { grid-template-columns: 1fr; } }
    @media (max-width: 620px) { .print-preview { grid-template-columns: 1fr; text-align: center; } .item-print-controls { grid-template-columns: 1fr; } }
    @media (max-width: 540px) { header, main { padding: 16px; } .controls, .control-group { width: 100%; } input, select, #refreshQueue { width: 100%; } .queue-item { grid-template-columns: 92px 1fr; } .queue-item img { width: 92px; height: 126px; } .queue-print-settings { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Staff Print Queue</h1>
      <p id="queueStatus">Loading queue…</p>
    </div>
    <div class="controls">
      <label class="control-group">
        Event ID
        <input id="eventId" aria-label="Event ID" placeholder="Event ID">
      </label>
      <button type="button" id="setToken" class="secondary" hidden>Unlock Staff Actions</button>
      <button type="button" id="refreshQueue">Refresh</button>
    </div>
    <section class="session-defaults" aria-labelledby="sessionDefaultsHeading">
      <h2 id="sessionDefaultsHeading">Session print defaults</h2>
      <p class="session-defaults-note">These settings apply to every queued photo unless you change one photo below.</p>
      <div class="session-defaults-content">
        <div class="session-controls">
          <label class="control-group">
            Photos on each sheet
            <select id="printLayout">
              <option value="single">1 full-size photo</option>
              <option value="double">2 copies of the photo</option>
            </select>
          </label>
          <label class="control-group">
            Paper direction
            <select id="printOrientation">
              <option value="auto">Automatic — match turned photo</option>
              <option value="landscape">Landscape — 6 wide × 4 tall</option>
              <option value="portrait">Portrait — 4 wide × 6 tall</option>
            </select>
          </label>
        </div>
        <div class="print-preview" aria-labelledby="printPreviewLabel">
          <div class="print-preview-visual" aria-hidden="true">
            <div id="printPreviewSheet" class="print-preview-sheet landscape single"></div>
          </div>
          <div class="print-preview-copy">
            <p id="printPreviewLabel" class="print-preview-label">Session default preview</p>
            <strong id="printPreviewSummary">Waiting for the next queued photo</strong>
            <p id="printPreviewDetails">Change the two session settings to see exactly how the sheet will be arranged.</p>
          </div>
        </div>
      </div>
    </section>
  </header>
  <main>
    <div id="queueList" aria-live="polite"></div>
  </main>
  <script src="scripts/staff-print.js"></script>
</body>
</html>
