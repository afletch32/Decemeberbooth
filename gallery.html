<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Event photo gallery" />
  <title>Event Gallery</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root { --accent:#d4f2d9; --accent-strong:#fff; --ink:#fff; --muted:#c3c9d8; --surface:#111523; --page:#0b0d12; --heading:'Comic Neue',cursive; --body:'Comic Neue',cursive; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); background:var(--page); font-family:var(--body); }
    .hero { padding:clamp(28px,7vw,72px) 20px 34px; text-align:center; background:linear-gradient(135deg,var(--hero-bg,#0f1220),var(--page)); border-bottom:1px solid color-mix(in srgb,var(--accent) 28%,transparent); }
    .hero-logo { display:none; max-width:150px; max-height:86px; margin:0 auto 18px; object-fit:contain; }
    .hero-logo.visible { display:block; }
    h1 { margin:0; color:var(--accent-strong); font:700 clamp(2rem,5vw,3.6rem)/1.05 var(--heading); }
    .subtitle { margin:12px auto 0; max-width:650px; color:var(--muted); font-size:1.05rem; }
    .toolbar { display:flex; justify-content:center; gap:12px; margin-top:24px; }
    button { border:1px solid color-mix(in srgb,var(--accent) 65%,transparent); border-radius:999px; padding:11px 18px; color:var(--page); background:var(--accent); font:600 1rem var(--body); cursor:pointer; }
    button.secondary { color:var(--ink); background:transparent; }
    .grid { width:min(1220px,100%); margin:0 auto; padding:24px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .card { min-width:0; overflow:hidden; border:1px solid color-mix(in srgb,var(--accent) 22%,transparent); border-radius:14px; background:var(--surface); box-shadow:0 10px 24px #0005; cursor:pointer; }
    .card img,.card video { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
    .card video { cursor:default; }
    .note { padding:30px 20px; color:var(--muted); text-align:center; }
    #loadMore { display:none; margin:0 auto 34px; }
    .viewer { position:fixed; inset:0; z-index:5; display:none; place-items:center; padding:20px; background:#05060acc; }
    .viewer.open { display:grid; }
    .viewer img,.viewer video { max-width:min(94vw,1100px); max-height:82vh; object-fit:contain; }
    .viewer-close { position:absolute; top:18px; right:18px; }
    .viewer-nav { position:absolute; top:50%; transform:translateY(-50%); padding:12px 16px; }
    .viewer-prev { left:14px; } .viewer-next { right:14px; }
    @media (min-width:700px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; padding:32px; } }
    @media (min-width:1100px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
    @media (max-width:560px) { .toolbar { flex-wrap:wrap; } .grid { padding:16px; gap:10px; } }
  </style>
</head>
<body>
  <header class="hero">
    <img id="galleryLogo" class="hero-logo" alt="Event logo">
    <h1 id="galleryTitle">Event Gallery</h1>
    <p id="gallerySubtitle" class="subtitle">Loading photos…</p>
    <div class="toolbar"><button type="button" id="viewAllButton" class="secondary">View all photos</button></div>
  </header>
  <main>
    <div id="galleryGrid" class="grid"></div>
    <div id="emptyState" class="note" hidden>No photos found yet.</div>
    <div id="errorState" class="note" hidden></div>
    <button type="button" id="loadMore">Load more photos</button>
  </main>
  <div id="viewer" class="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" class="viewer-close" id="viewerClose" aria-label="Close photo viewer">Close</button>
    <button type="button" class="viewer-nav viewer-prev" id="viewerPrev" aria-label="Previous photo">‹</button>
    <div id="viewerMedia"></div>
    <button type="button" class="viewer-nav viewer-next" id="viewerNext" aria-label="Next photo">›</button>
  </div>
  <script src="scripts/gallery.js"></script>
</body>
</html>
